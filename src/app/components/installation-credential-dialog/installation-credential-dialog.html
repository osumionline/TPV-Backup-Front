<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
    <div class="credential-result"
         role="status">
        <mat-icon class="credential-result__icon"
                  fontSet="material-symbols-outlined">
            key
        </mat-icon>

        <p>{{ data.message }}</p>

        <p class="credential-warning">
            Guarda estos datos ahora. El secreto no podrá volver a consultarse una vez cierres esta ventana.
        </p>

        <div class="credential-field">
            <span class="credential-field__label">Key ID</span>

            <div class="credential-field__value">
                <code>{{ data.keyId }}</code>

                <button mat-icon-button
                        type="button"
                        aria-label="Copiar Key ID"
                        matTooltip="Copiar Key ID"
                        (click)="copyCredential(data.keyId, 'Key ID')">
                    <mat-icon fontSet="material-symbols-outlined">content_copy</mat-icon>
                </button>
            </div>
        </div>

        <div class="credential-field">
            <span class="credential-field__label">Secret</span>

            <div class="credential-field__value">
                <code>{{ data.secret }}</code>

                <button mat-icon-button
                        type="button"
                        aria-label="Copiar secret"
                        matTooltip="Copiar secret"
                        (click)="copyCredential(data.secret, 'Secret')">
                    <mat-icon fontSet="material-symbols-outlined">content_copy</mat-icon>
                </button>
            </div>
        </div>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-flat-button
            type="button"
            (click)="close()">
        Ya he guardado la credencial
    </button>
</mat-dialog-actions>

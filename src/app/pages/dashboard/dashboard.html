<main class="dashboard">
  <header class="dashboard__header">
    <div>
      <p class="dashboard__eyebrow">Osumi TPV Backup</p>
      <h1>Panel de administración</h1>
    </div>

    <button type="button" (click)="logout()">Cerrar sesión</button>
  </header>

  @if (authService.user(); as user) {
    <section class="dashboard__card">
      <h2>Sesión activa</h2>
      <dl>
        <div>
          <dt>Nombre</dt>
          <dd>{{ user.name }}</dd>
        </div>
        <div>
          <dt>Email</dt>
          <dd>{{ user.email }}</dd>
        </div>
        <div>
          <dt>Public ID</dt>
          <dd>{{ user.publicId }}</dd>
        </div>
      </dl>
    </section>
  }
</main>

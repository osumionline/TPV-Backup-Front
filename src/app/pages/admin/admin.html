<mat-sidenav-container class="admin-shell">
  <mat-sidenav class="admin-shell__sidenav"
               [mode]="isHandset() ? 'over' : 'side'"
               [opened]="!isHandset() || mobileMenuOpen()"
               (closedStart)="mobileMenuOpen.set(false)">
    <div class="brand">
      <span class="brand__eyebrow">Osumi</span>
      <strong>TPV Backup</strong>
    </div>

    <nav aria-label="Navegación principal">
      <mat-nav-list>
        <a mat-list-item
           routerLink="/subscriptions"
           routerLinkActive="nav-link--active"
           (click)="closeMobileMenu()">
          <mat-icon matListItemIcon
                    fontSet="material-symbols-outlined">
            subscriptions
          </mat-icon>
          <span matListItemTitle>Suscripciones</span>
        </a>
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="admin-shell__content">
    <mat-toolbar class="admin-toolbar">
      @if (isHandset()) {
      <button mat-icon-button
              type="button"
              aria-label="Abrir menú"
              (click)="toggleMobileMenu()">
        <mat-icon fontSet="material-symbols-outlined">menu</mat-icon>
      </button>
      }

      <span class="admin-toolbar__title">Administración</span>
      <span class="admin-toolbar__spacer"></span>

      @if (user(); as currentUser) {
      <div class="admin-toolbar__user">
        <span>{{ currentUser.name }}</span>
        <small>{{ currentUser.email }}</small>
      </div>
      }

      <button mat-icon-button
              type="button"
              aria-label="Cerrar sesión"
              matTooltip="Cerrar sesión"
              (click)="logout()">
        <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="admin-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
